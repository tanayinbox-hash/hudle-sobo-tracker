<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hudle SoBo Live Slot Tracker & Calendar | South Mumbai</title>
  <meta name="description" content="Automated multi-venue calendar schedule tracker and slot sniper for Padel and Pickleball venues in South Mumbai on Hudle.in">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* CRITICAL STYLES FOR GUARANTEED DARK MODE, SPORT FILTERS & PERFECT STICKY SCROLLING */
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-highlight: rgba(0, 240, 255, 0.35);
      
      --accent-padel: #ccff00;      /* Electric Neon Lime */
      --accent-pickle: #00f0ff;     /* Cyan Neon */
      --accent-success: #10b981;    /* Emerald Green */
      --accent-warning: #f59e0b;    /* Amber */
      --accent-danger: #ef4444;     /* Coral Red */
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(204, 255, 0, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 45%);
      background-attachment: fixed;
      padding: 16px 14px 60px;
    }

    .app-container {
      max-width: 1550px;
      margin: 0 auto;
    }

    /* HEADER */
    header.app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-padel), var(--accent-pickle));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.4);
    }

    .brand-title h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-success);
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-success);
      box-shadow: 0 0 10px var(--accent-success);
    }

    .clock-display {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent-pickle);
      background: rgba(0, 240, 255, 0.08);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* TOOLBAR BAR: PADEL OR PICKLE FILTER & DATE SELECTION */
    .toolbar-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .sport-filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 2px;
    }

    .sport-filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .sport-filter-btn.active-padel {
      background: rgba(204, 255, 0, 0.22);
      border-color: var(--accent-padel);
      color: var(--accent-padel);
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.35);
    }

    .sport-filter-btn.active-pickle {
      background: rgba(0, 240, 255, 0.22);
      border-color: var(--accent-pickle);
      color: var(--accent-pickle);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
    }

    .date-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .date-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .date-btn.active {
      background: rgba(204, 255, 0, 0.18);
      border-color: var(--accent-padel);
      color: var(--accent-padel);
    }

    /* FULL TIMESLOT CALENDAR MATRIX CONTAINER WITH DUAL SCROLLING & PINNED FIRST COLUMN */
    .calendar-container {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 600px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.5);
      margin-bottom: 28px;
      position: relative;
    }

    /* CUSTOM SCROLLBAR */
    .calendar-container::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .calendar-container::-webkit-scrollbar-track {
      background: rgba(10, 15, 29, 0.6);
    }

    .calendar-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    /* TABLE LAYOUT FIXES FOR ZERO-GLITCH SCROLLING */
    .calendar-table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0; /* ELIMINATE GAPS TO PREVENT BG SCROLL BLEED */
    }

    /* CORNER PINNED HEADER CELL */
    .calendar-table th.venue-col-header {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 40; /* HIGHEST Z-INDEX SO CORNER NEVER OVERLAPS */
      background: #111827;
      text-align: left;
      min-width: 250px;
      color: var(--text-primary);
      border-right: 2px solid rgba(255, 255, 255, 0.15);
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      box-shadow: 4px 0 10px rgba(0,0,0,0.5);
    }

    /* TIMESLOT HEADERS */
    .calendar-table th {
      background: #0f172a;
      color: var(--text-secondary);
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 90px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* VENUE SECTION DIVIDER ROW */
    .venue-divider-cell {
      background: #1e293b;
      border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
      padding: 8px 16px !important;
      text-align: left !important;
    }

    .divider-content {
      position: sticky;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 15;
    }

    .divider-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(204, 255, 0, 0.2);
      color: var(--accent-padel);
      border: 1px solid rgba(204, 255, 0, 0.4);
      letter-spacing: 0.5px;
    }

    .divider-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .divider-location {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* INDIVIDUAL COURT ROWS */
    .calendar-table td {
      background: #0f172a;
      padding: 6px;
      text-align: center;
      vertical-align: middle;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* STICKY COURT NAME CELL (SOLID BG, ZERO TRANSPARENCY, NO BLEED) */
    .calendar-table td.venue-label-cell {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #111827; /* SOLID OPAQUE DARK BACKGROUND */
      text-align: left;
      padding: 10px 16px;
      border-right: 2px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 4px 0 10px rgba(0,0,0,0.5);
      min-width: 250px;
    }

    .court-row-label {
      padding-left: 24px !important;
    }

    .court-title-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .matrix-slot-btn {
      width: 100%;
      min-width: 82px;
      padding: 8px 4px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.2s ease;
    }

    .matrix-slot-btn.open {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-success);
    }

    .matrix-slot-btn.open:hover {
      background: var(--accent-padel);
      color: #0f172a;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(204, 255, 0, 0.6);
    }

    .matrix-slot-btn.booked {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--accent-danger);
      opacity: 0.55;
      cursor: not-allowed;
    }

    .matrix-slot-btn.empty {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      cursor: default;
      opacity: 0.3;
    }

    /* SNIPER CONTROL PANEL */
    .sniper-panel {
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border-highlight);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.12);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-pickle);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .form-control {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .btn-snipe {
      background: linear-gradient(135deg, var(--accent-padel), #a3e635);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.3);
      width: 100%;
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 90%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon">🎾</div>
        <div class="brand-title">
          <h1>Hudle SoBo Schedule Tracker</h1>
          <p>South Mumbai Padel & Pickleball Court Engine</p>
        </div>
      </div>
      
      <div class="header-actions">
        <div class="live-badge" id="live-sync-badge">
          <span class="pulse"></span>
          <span id="sync-status-text">Hudle API Sync</span>
        </div>
        <div class="clock-display" id="clock">17:49:36.000 IST</div>
        <button class="btn-settings" id="btn-open-settings">
          ⚙️ Settings
        </button>
      </div>
    </header>

    <!-- TOOLBAR BAR: PADEL OR PICKLE FILTER & DATE SELECTION -->
    <div class="toolbar-bar">
      <!-- TOP SPORT FILTER (ONLY PADEL & PICKLEBALL) -->
      <div class="sport-filter-group">
        <span class="filter-label">Sport Filter:</span>
        <button class="sport-filter-btn active-padel" id="filter-btn-padel" onclick="setSportFilter('padel')">
          🎾 Padel (4 Venues)
        </button>
        <button class="sport-filter-btn" id="filter-btn-pickle" onclick="setSportFilter('pickleball')">
          🏓 Pickleball (4 Venues)
        </button>
      </div>

      <!-- DATE SELECTION PILLS -->
      <div class="date-pills" id="date-pills-bar">
        <!-- Date pills rendered dynamically -->
      </div>
    </div>

    <!-- UNIFIED CALENDAR SCHEDULE MATRIX (ZERO-GLITCH STICKY SCROLLING) -->
    <div class="calendar-container">
      <table class="calendar-table">
        <thead>
          <tr id="calendar-header-row">
            <th class="venue-col-header">South Mumbai Venue & Court</th>
            <!-- Dynamic timeslot headers -->
          </tr>
        </thead>
        <tbody id="calendar-matrix-body">
          <!-- Calendar matrix rows rendered dynamically -->
        </tbody>
      </table>
    </div>

    <!-- SNIPER CONTROL PANEL -->
    <div class="sniper-panel">
      <div class="panel-header">
        <div class="panel-title">
          ⚡ Millisecond Slot Sniper & Auto-Booker Control
        </div>
        <span style="font-size: 13px; color: var(--text-secondary);">Target Release: 00:00:00.000 Midnight</span>
      </div>
      
      <form class="control-form" id="sniper-form">
        <div class="form-group">
          <label>Target Venue</label>
          <select class="form-control" id="target-venue-select">
            <option value="9672dd36-168a-40d8-85be-28d7bef3543b">Courtside Padel Social Club (Worli)</option>
            <option value="b82d19f2-8690-4975-a5d1-5e9ab886e10d">Padel 360 (Worli)</option>
            <option value="7d204b7b-8574-4ac7-823a-2f9d77789dc0">NSCI Padel Club (Worli)</option>
            <option value="f598bca7-4947-4bf6-bd2d-f741e3abea82">7Padel | PDP (Malabar Hill)</option>
            <option value="f8172f52-47fc-4e19-ba87-f9ae625eccb8">Smash Dock (Colaba)</option>
            <option value="3e7f36b1-775e-4178-bae8-c1dbcb697809">Global Sports (Lower Parel)</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Booking Date</label>
          <input type="date" class="form-control" id="booking-date-input">
        </div>
        
        <div class="form-group">
          <label>Preferred Time</label>
          <select class="form-control" id="preferred-time-select">
            <option value="19:00,20:00">Evening Prime (7 PM - 9 PM)</option>
            <option value="07:00,08:00">Morning Prime (7 AM - 9 AM)</option>
            <option value="20:00,21:00">Late Evening (8 PM - 10 PM)</option>
          </select>
        </div>
        
        <div class="form-group">
          <button type="submit" class="btn-snipe">
            🚀 ARM & LAUNCH SNIPER
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h3 style="font-size: 18px; font-weight: 800;">⚙️ Hudle API & Alert Settings</h3>
        <button id="btn-close-settings" style="background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer;">&times;</button>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label>Hudle Authorization Token</label>
          <input type="password" class="form-control" id="hudle-token-input" placeholder="Paste Authorization Bearer Token here">
        </div>
        
        <div class="form-group">
          <label>Telegram Bot Token (Optional)</label>
          <input type="text" class="form-control" id="telegram-token-input" placeholder="123456789:ABCdef...">
        </div>
        
        <div class="form-group">
          <label>Telegram Chat ID (Optional)</label>
          <input type="text" class="form-control" id="telegram-chat-input" placeholder="-100123456789">
        </div>
        
        <button class="btn-snipe" id="btn-save-settings" style="width: 100%; margin-top: 10px;">
          Save Configuration & Sync Live API
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
