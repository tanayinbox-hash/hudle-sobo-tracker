<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hudle South Mumbai Slot Tracker | Padel & Pickleball</title>
  <meta name="description" content="Live court availability and schedule tracker for Padel and Pickleball venues in South Mumbai on Hudle.in">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* CLEAN & SIMPLIFIED HUDLE DESIGN SYSTEM */
    :root {
      --bg-main: #0B0F19;
      --bg-card: #111827;
      --bg-header: #1E293B;
      --border-color: #1E293B;
      --border-light: rgba(255, 255, 255, 0.08);
      
      --hudle-blue: #2563EB;
      --hudle-green: #10B981;
      --hudle-green-bg: rgba(16, 185, 129, 0.12);
      --hudle-green-hover: #059669;
      --hudle-red: #EF4444;
      --hudle-red-bg: rgba(239, 68, 68, 0.08);
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 1550px;
      margin: 0 auto;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--hudle-green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--hudle-green);
      box-shadow: 0 0 8px var(--hudle-green);
    }

    .btn-settings {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* CONTROLS BAR: SPORT TABS & DATE BAR */
    .controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .sport-tabs {
      display: flex;
      gap: 8px;
      background: #0B0F19;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .sport-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sport-tab.active {
      background: var(--hudle-blue);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .date-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .date-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .date-pill.active {
      background: rgba(37, 99, 235, 0.15);
      border-color: var(--hudle-blue);
      color: #FFFFFF;
    }

    /* SCHEDULE MATRIX TABLE */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 640px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .table-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .schedule-table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0;
    }

    .schedule-table th.venue-corner {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 40;
      background: #1E293B;
      text-align: left;
      min-width: 270px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      border-right: 2px solid var(--border-color);
      border-bottom: 2px solid var(--border-color);
      padding: 14px 18px;
    }

    .schedule-table th {
      background: #1E293B;
      color: var(--text-muted);
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-light);
      min-width: 96px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* VENUE DIVIDER ROW */
    .venue-header-row td {
      background: #0B0F19 !important;
      border-top: 1px solid var(--border-color) !important;
      border-bottom: 1px solid var(--border-color) !important;
      padding: 10px 18px !important;
      text-align: left !alignment;
    }

    .venue-header-content {
      position: sticky;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
    }

    .venue-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(37, 99, 235, 0.15);
      color: var(--hudle-blue);
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .venue-name {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .venue-loc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* COURT ROW & CELLS */
    .schedule-table td {
      background: var(--bg-card);
      padding: 6px;
      text-align: center;
      vertical-align: middle;
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .schedule-table td.court-label-cell {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #111827;
      text-align: left;
      padding: 10px 18px 10px 30px;
      border-right: 2px solid var(--border-color);
      border-bottom: 1px solid var(--border-light);
      min-width: 270px;
    }

    .court-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* HUDLE CLEAN SLOT BUTTONS */
    .slot-btn {
      width: 100%;
      min-width: 84px;
      padding: 8px 6px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .slot-btn.available {
      background: var(--hudle-green-bg);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--hudle-green);
    }

    .slot-btn.available:hover {
      background: var(--hudle-green);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    .slot-btn.booked {
      background: var(--hudle-red-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--hudle-red);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .slot-btn.empty {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
      cursor: default;
      opacity: 0.25;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 440px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      background: #0B0F19;
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .btn-primary {
      background: var(--hudle-blue);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">🎾</div>
        <div class="brand-text">
          <h1>Hudle South Mumbai Slot Tracker</h1>
          <p>Live Court Schedule & Availability Matrix</p>
        </div>
      </div>
      
      <div class="header-controls">
        <div class="sync-status" id="live-sync-badge">
          <span class="pulse-dot"></span>
          <span id="sync-status-text">Hudle API Sync</span>
        </div>
        <button class="btn-settings" id="btn-open-settings">
          ⚙️ Settings
        </button>
      </div>
    </header>

    <!-- CONTROLS BAR: SPORT SELECTION & DATE BAR -->
    <div class="controls-bar">
      <!-- SPORT TABS -->
      <div class="sport-tabs">
        <button class="sport-tab active" id="filter-btn-padel" onclick="setSportFilter('padel')">
          🎾 Padel
        </button>
        <button class="sport-tab" id="filter-btn-pickle" onclick="setSportFilter('pickleball')">
          🏓 Pickleball
        </button>
      </div>

      <!-- DATE SELECTION PILLS -->
      <div class="date-pills" id="date-pills-bar">
        <!-- Date pills rendered dynamically -->
      </div>
    </div>

    <!-- SCHEDULE MATRIX TABLE -->
    <div class="table-container">
      <table class="schedule-table">
        <thead>
          <tr id="calendar-header-row">
            <th class="venue-corner">South Mumbai Venue & Court</th>
            <!-- Dynamic timeslot headers -->
          </tr>
        </thead>
        <tbody id="calendar-matrix-body">
          <!-- Calendar matrix rows rendered dynamically -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h3 style="font-size: 16px; font-weight: 700;">⚙️ Hudle API Settings</h3>
        <button id="btn-close-settings" style="background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer;">&times;</button>
      </div>
      
      <div class="form-group">
        <label>Hudle Authorization Token</label>
        <input type="password" class="form-control" id="hudle-token-input" placeholder="Paste Authorization Bearer Token here">
      </div>
      
      <button class="btn-primary" id="btn-save-settings" style="margin-top: 10px;">
        Save Configuration
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
