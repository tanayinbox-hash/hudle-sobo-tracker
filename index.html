<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hudle Mumbai Live Slot Tracker | Select Locations & Courts</title>
  <meta name="description" content="Live court availability schedule tracker for Padel and Pickleball venues across Mumbai on Hudle.in">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: #111827;
      --bg-header: #1E293B;
      --border-color: #1E293B;
      --border-light: rgba(255, 255, 255, 0.08);
      
      --hudle-blue: #2563EB;
      --hudle-blue-light: rgba(37, 99, 235, 0.15);
      --hudle-green: #10B981;
      --hudle-green-bg: rgba(16, 185, 129, 0.12);
      --hudle-red: #EF4444;
      --hudle-red-bg: rgba(239, 68, 68, 0.08);
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* HEADER */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--hudle-green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--hudle-green);
      box-shadow: 0 0 8px var(--hudle-green);
    }

    .btn-user-profile {
      background: var(--hudle-blue-light);
      border: 1px solid rgba(37, 99, 235, 0.4);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-user-profile:hover {
      background: var(--hudle-blue);
    }

    /* CONTROLS BAR: SPORT SELECTION & CALENDAR DATE PICKER */
    .controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .sport-tabs {
      display: flex;
      gap: 8px;
      background: #0B0F19;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .sport-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sport-tab.active {
      background: var(--hudle-blue);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* DATE SELECTION WITH CALENDAR PICKER */
    .date-selection-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .calendar-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0B0F19;
      border: 1px solid var(--hudle-blue);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .calendar-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--hudle-blue);
    }

    .date-picker-input {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .date-picker-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .date-pills {
      display: flex;
      gap: 6px;
    }

    .date-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .date-pill.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: var(--hudle-blue);
      color: #FFFFFF;
    }

    /* SPECIFIC VENUE / LOCATION MULTI-SELECT FILTER BAR */
    .venue-filter-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }

    .venue-filter-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .venue-filter-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .venue-count-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(37, 99, 235, 0.15);
      color: var(--hudle-blue);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .venue-search-box {
      background: #0B0F19;
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-body);
      min-width: 220px;
      outline: none;
    }

    .venue-search-box:focus {
      border-color: var(--hudle-blue);
    }

    .venue-action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-text-action {
      background: transparent;
      border: none;
      color: var(--hudle-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-text-action:hover {
      text-decoration: underline;
    }

    .venue-pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .venue-pills-grid::-webkit-scrollbar {
      width: 5px;
    }

    .venue-pills-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .venue-pill {
      background: #0B0F19;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      user-select: none;
    }

    .venue-pill:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    .venue-pill.active {
      background: rgba(37, 99, 235, 0.2);
      border-color: var(--hudle-blue);
      color: #FFFFFF;
    }

    .venue-pill .check-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .venue-pill.active .check-icon {
      background: var(--hudle-blue);
      border-color: var(--hudle-blue);
      color: #FFFFFF;
    }

    /* SCHEDULE MATRIX TABLE */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 640px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .table-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .schedule-table {
      width: max-content;
      border-collapse: separate;
      border-spacing: 0;
    }

    .schedule-table th.venue-corner {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 40;
      background: #1E293B;
      text-align: left;
      min-width: 270px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      border-right: 2px solid var(--border-color);
      border-bottom: 2px solid var(--border-color);
      padding: 14px 18px;
    }

    .schedule-table th {
      background: #1E293B;
      color: var(--text-muted);
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-light);
      min-width: 96px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* VENUE DIVIDER ROW */
    .venue-header-row td {
      background: #0B0F19 !important;
      border-top: 1px solid var(--border-color) !important;
      border-bottom: 1px solid var(--border-color) !important;
      padding: 10px 18px !important;
      text-align: left;
    }

    .venue-header-content {
      position: sticky;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
    }

    .venue-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(37, 99, 235, 0.15);
      color: var(--hudle-blue);
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .venue-name {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .venue-loc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* COURT ROW & CELLS */
    .schedule-table td {
      background: var(--bg-card);
      padding: 6px;
      text-align: center;
      vertical-align: middle;
      border-right: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .schedule-table td.court-label-cell {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #111827;
      text-align: left;
      padding: 10px 18px 10px 30px;
      border-right: 2px solid var(--border-color);
      border-bottom: 1px solid var(--border-light);
      min-width: 270px;
    }

    .court-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* HUDLE CLEAN SLOT BUTTONS */
    .slot-btn {
      width: 100%;
      min-width: 84px;
      padding: 8px 6px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .slot-btn.available {
      background: var(--hudle-green-bg);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--hudle-green);
    }

    .slot-btn.available:hover {
      background: var(--hudle-green);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    .slot-btn.booked {
      background: var(--hudle-red-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--hudle-red);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .slot-btn.empty {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
      cursor: default;
      opacity: 0.25;
    }

    /* MODAL OVERLAYS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 440px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      background: #0B0F19;
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .btn-primary {
      background: var(--hudle-blue);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">🎾</div>
        <div class="brand-text">
          <h1>Hudle Mumbai Court Tracker</h1>
          <p>Live Court Schedule & Availability Matrix</p>
        </div>
      </div>
      
      <div class="header-controls">
        <div class="sync-status" id="live-sync-badge">
          <span class="pulse-dot"></span>
          <span id="sync-status-text">Hudle API Sync</span>
        </div>

        <!-- LOGIN / USER PROFILE BUTTON -->
        <button class="btn-user-profile" id="btn-open-login">
          <span id="user-avatar-icon">👤</span>
          <span id="user-display-name">Login</span>
        </button>
      </div>
    </header>

    <!-- CONTROLS BAR: SPORT SELECTION, CALENDAR DATE PICKER & QUICK DATE PILLS -->
    <div class="controls-bar">
      <!-- SPORT TABS -->
      <div class="sport-tabs">
        <button class="sport-tab active" id="filter-btn-padel" onclick="setSportFilter('padel')">
          🎾 Padel
        </button>
        <button class="sport-tab" id="filter-btn-pickle" onclick="setSportFilter('pickleball')">
          🏓 Pickleball
        </button>
      </div>

      <!-- DATE SELECTION WITH CALENDAR PICKER -->
      <div class="date-selection-group">
        <!-- CALENDAR DATE PICKER -->
        <div class="calendar-input-wrapper">
          <span class="calendar-label">📅 Date:</span>
          <input type="date" class="date-picker-input" id="calendar-date-input">
        </div>

        <!-- QUICK DATE PILLS -->
        <div class="date-pills" id="date-pills-bar">
          <!-- Quick date pills rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- SPECIFIC VENUE / LOCATION MULTI-SELECT FILTER BAR -->
    <div class="venue-filter-bar">
      <div class="venue-filter-top">
        <div class="venue-filter-title">
          <span>📍 Select Specific Locations:</span>
          <span class="venue-count-badge" id="venue-count-badge">84 Venues</span>
        </div>

        <input type="text" class="venue-search-box" id="venue-search-input" placeholder="🔍 Search location name..." oninput="filterVenuePillsBySearch()">

        <div class="venue-action-btns">
          <button class="btn-text-action" onclick="selectAllVenues()">Select All</button>
          <span style="color: var(--text-dim);">|</span>
          <button class="btn-text-action" onclick="selectSoboVenuesOnly()">SoBo Only</button>
          <span style="color: var(--text-dim);">|</span>
          <button class="btn-text-action" style="color: var(--text-muted);" onclick="clearAllVenues()">Reset</button>
        </div>
      </div>

      <div class="venue-pills-grid" id="venue-pills-grid">
        <!-- Individual venue location pills rendered dynamically -->
      </div>
    </div>

    <!-- SCHEDULE MATRIX TABLE -->
    <div class="table-container">
      <table class="schedule-table">
        <thead>
          <tr id="calendar-header-row">
            <th class="venue-corner">Mumbai Venue & Court</th>
            <!-- Dynamic timeslot headers -->
          </tr>
        </thead>
        <tbody id="calendar-matrix-body">
          <!-- Calendar matrix rows rendered dynamically -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- LOGIN & PREFERENCES MODAL -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h3 style="font-size: 16px; font-weight: 700;">👤 User Profile & Venue Preferences</h3>
        <button id="btn-close-login" style="background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer;">&times;</button>
      </div>
      
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" class="form-control" id="login-name-input" placeholder="e.g. Tanay Gandhi">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" class="form-control" id="login-phone-input" placeholder="9167939419">
      </div>
      
      <div class="form-group">
        <label>Hudle Authorization Token</label>
        <input type="password" class="form-control" id="hudle-token-input" placeholder="Paste Authorization Bearer Token here">
      </div>

      <div style="margin-top: 10px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="save-preference-checkbox" checked style="accent-color: var(--hudle-blue); cursor: pointer;">
        <label for="save-preference-checkbox" style="font-size: 12px; color: var(--text-muted); cursor: pointer;">Remember my selected venues & preferred sport</label>
      </div>
      
      <button class="btn-primary" id="btn-save-login">
        Save Profile & Preferences
      </button>
    </div>
  </div>

  <script src="app.js?v=2.0"></script>
</body>
</html>
